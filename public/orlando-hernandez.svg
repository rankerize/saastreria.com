<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Monograma de Orlando Hernández Manrique">
  <defs>
    <linearGradient id="navy-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24497A"/>
      <stop offset="1" stop-color="#1B3461"/>
    </linearGradient>
    <linearGradient id="gold-text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D4B567"/>
      <stop offset="1" stop-color="#BFA255"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="32" fill="url(#navy-bg)"/>
  <!-- Costura interior, motivo de la marca -->
  <rect x="11" y="11" width="138" height="138" rx="24" fill="none" stroke="#BFA255" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.45"/>
  <text x="80" y="100" text-anchor="middle"
        font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif"
        font-size="56" font-weight="800" fill="url(#gold-text)" letter-spacing="2">OH</text>
</svg>
